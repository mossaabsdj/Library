<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>SmartPOS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", "Roboto", sans-serif;
        background: transparent;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }

      .splash-container {
        background: linear-gradient(135deg, #667eea 0%, #0b164f 100%);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
        text-align: center;
        width: 500px;
        height: 400px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }

      body.fade-out .splash-container {
        opacity: 0;
        transform: scale(0.96);
      }

      .splash-container::before {
        content: "";
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.5;
        }
        50% {
          transform: scale(1.1);
          opacity: 0.8;
        }
      }

      .content {
        position: relative;
        z-index: 1;
      }

      .icon {
        width: 100px;
        height: 100px;
        background: white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 0 auto 25px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        animation: bounce 2s ease-in-out infinite;
      }

      @keyframes bounce {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-10px);
        }
      }

      .icon svg {
        width: 56px;
        height: 56px;
      }

      h1 {
        color: white;
        font-size: 32px;
        font-weight: 700;
        margin-bottom: 8px;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        letter-spacing: -0.02em;
      }

      .subtitle {
        color: rgba(255, 255, 255, 0.95);
        font-size: 17px;
        font-weight: 500;
        margin-bottom: 35px;
      }

      .loader {
        width: 200px;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        overflow: hidden;
        margin: 0 auto;
      }

      .loader-bar {
        height: 100%;
        background: white;
        border-radius: 10px;
        animation: loading 2s ease-in-out infinite;
        box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      }

      @keyframes loading {
        0% {
          width: 0%;
        }
        50% {
          width: 70%;
        }
        100% {
          width: 100%;
        }
      }

      .version {
        color: rgba(255, 255, 255, 0.7);
        font-size: 12px;
        margin-top: 20px;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <div class="splash-container">
      <div class="content">
        <div class="icon">
          <!-- SmartPOS Store Icon -->
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="#764ba2"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"
            />
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8" />
            <path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4" />
            <path d="M2 7h20" />
            <path
              d="M22 7v3a2 2 0 0 1-2 2v0a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 16 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 12 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 8 12a2.7 2.7 0 0 1-1.59-.63.7.7 0 0 0-.82 0A2.7 2.7 0 0 1 4 12v0a2 2 0 0 1-2-2V7"
            />
          </svg>
        </div>
        <h1>SmartPOS</h1>
        <div class="subtitle">Gestion de Stock & Point de Vente</div>
        <div class="loader">
          <div class="loader-bar"></div>
        </div>
        <div class="version">Version 1.0.0</div>
      </div>
    </div>
  </body>
</html>
